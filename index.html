<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorocaba IA - A IA da Manchester Paulista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #chat-window {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('images/background.jpg');
            background-size: cover;
            background-position: center;
        }
        .message-ai p, .message-user p { word-wrap: break-word; }
        .hidden { display: none; }
        .mic-wrapper.recording button {
            transform: scale(1.2);
            background-color: #1d4ed8; /* Tom de azul mais escuro (blue-700) */
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="flex flex-col w-full max-w-2xl h-[90vh] bg-white rounded-2xl shadow-2xl m-4">
        <header class="bg-[#2d4a32] text-white p-4 rounded-t-2xl shadow-md flex items-center space-x-4">
            <img src="images/avatar.png" alt="Avatar Sorocab.IA" class="h-16 w-16 rounded-full border-2 border-white object-cover">
            <div>
                <h1 class="text-xl font-bold">Sorocaba IA</h1>
                <p class="text-sm text-gray-200">A voz da Manchester Paulista</p>
            </div>
        </header>

        <main id="chat-window" class="flex-1 p-6 overflow-y-auto">
            <div class="message-ai mb-4 flex">
                <div class="bg-gray-200 text-gray-800 rounded-lg rounded-bl-none p-3 max-w-lg">
                    <p class="text-sm">E aí, firmeza? Daora te ver por aqui! Sou a Sorocaba IA, a inteligência artificial com a alma da nossa cidade. Pode perguntar o que quiser sobre a Manchester Paulista, mano. Tô aqui pra ajudar!</p>
                </div>
            </div>
        </main>

        <footer class="p-4 bg-white rounded-b-2xl border-t border-gray-200">
            <div class="flex items-center bg-gray-100 rounded-full p-2">
                <input type="text" id="user-input" placeholder="O que cê qué sabê, mano?" class="flex-1 bg-transparent border-none focus:ring-0 text-gray-800 placeholder-gray-500 px-4">
                
                <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white rounded-full p-2.5 transition-colors duration-300 ml-2 hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" /></svg>
                </button>
                
                <div class="mic-wrapper">
                    <button id="mic-button" class="bg-blue-600 hover:bg-blue-700 text-white rounded-full p-2.5 transition-colors duration-300 ml-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z" clip-rule="evenodd" /></svg>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const micButton = document.getElementById('mic-button');
        const micWrapper = micButton.parentElement;

        userInput.addEventListener('input', () => {
            if (userInput.value.trim() !== '') {
                sendButton.classList.remove('hidden');
                micWrapper.classList.add('hidden');
            } else {
                sendButton.classList.add('hidden');
                micWrapper.classList.remove('hidden');
            }
        });

        async function sendMessage(directMessage = null) {
            const message = directMessage || userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            if (directMessage === null) userInput.value = '';
            userInput.dispatchEvent(new Event('input'));
            
            showTypingIndicator();

            try {
                const response = await fetch('/api/ask-sorocaba-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: message }),
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                removeTypingIndicator();
                appendMessage(data.answer, 'ai');

            } catch (error) {
                console.error('Erro ao comunicar com o backend:', error);
                removeTypingIndicator();
                appendMessage('Putz, mano, deu um B.O. aqui no sistema. Tenta de novo daqui a pouquinho, firmeza?', 'ai');
            }
        }

        sendButton.addEventListener('click', () => sendMessage());
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });

        function appendMessage(message, sender) {
            const wrapper = document.createElement('div');
            const bubble = document.createElement('div');
            
            if (sender === 'user') {
                wrapper.className = 'message-user mb-4 flex justify-end';
                bubble.className = 'bg-[#2d4a32] text-white rounded-lg rounded-br-none p-3 max-w-lg';
            } else { // 'ai' or system
                wrapper.className = 'message-ai mb-4 flex';
                bubble.className = 'bg-gray-200 text-gray-800 rounded-lg rounded-bl-none p-3 max-w-lg';
            }
            
            bubble.innerHTML = `<p class="text-sm">${message.replace(/\n/g, '<br>')}</p>`;
            wrapper.appendChild(bubble);
            chatWindow.appendChild(wrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showTypingIndicator() {
            const indicator = `<div id="typing-indicator" class="message-ai mb-4 flex"><div class="bg-gray-200 text-gray-800 rounded-lg rounded-bl-none p-3 max-w-lg"><div class="flex items-center space-x-1"><span class="text-sm">Sorocab.IA tá digitando</span><div class="h-2 w-2 bg-gray-400 rounded-full animate-bounce [animation-delay:-0.3s]"></div><div class="h-2 w-2 bg-gray-400 rounded-full animate-bounce [animation-delay:-0.15s]"></div><div class="h-2 w-2 bg-gray-400 rounded-full animate-bounce"></div></div></div></div>`;
            chatWindow.insertAdjacentHTML('beforeend', indicator);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function removeTypingIndicator() {
            document.getElementById('typing-indicator')?.remove();
        }

        // --- Lógica de Reconhecimento de Voz ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;

            micButton.addEventListener('click', () => {
                micWrapper.classList.toggle('recording');
                try {
                    recognition.start();
                } catch(e) {
                    micWrapper.classList.remove('recording');
                    console.error("Recognition already started");
                }
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                sendMessage(transcript);
            };

            recognition.onspeechend = () => {
                micWrapper.classList.remove('recording');
                recognition.stop();
            };

            recognition.onerror = (event) => {
                micWrapper.classList.remove('recording');
                console.error('Erro no reconhecimento de voz:', event.error);
                appendMessage('Ih, mano, não consegui te ouvir direito. Vê se o microfone tá liberado aí.', 'ai');
            };
        } else {
            micWrapper.style.display = 'none';
        }
    </script>
</body>
</html>
