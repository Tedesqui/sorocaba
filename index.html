<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorocaba IA - Direto da Manchester Paulista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #chat-window {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('images/background.jpg');
            background-size: cover;
            background-position: center;
        }
        .message-ai p, .message-user p { word-wrap: break-word; }
        .hidden { display: none; }
        
        .mic-wrapper.recording button {
            transform: scale(1.2);
            background-color: #1d4ed8; /* Tom de azul mais escuro (blue-700) */
        }

        /* Estilos para o Modal do Avatar */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 500px;
            /* NOVA LINHA: Para posicionar a imagem 100px para cima */
            margin-top: -10px; /* Isso move o conteúdo do modal 100px para cima */
        }
        .close-button {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
        }
        .close-button:hover,
        .close-button:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="flex flex-col w-full h-screen bg-white shadow-2xl md:max-w-2xl md:h-[90vh] md:rounded-2xl md:m-4">
        <header class="bg-[#2d4a32] text-white p-4 rounded-t-2xl shadow-md flex items-center space-x-4">
            <img id="avatar-img" src="images/avatar.jpg" alt="Avatar Sorocab.IA" class="h-16 w-16 rounded-full border-2 border-white object-cover cursor-pointer hover:opacity-80 transition-opacity">
            <div>
                <h1 class="text-xl font-bold">Sorocaba - IA</h1>
                <p class="text-sm text-gray-200">O assistente virtual de Sorocaba</p>
            </div>
        </header>

        <main id="chat-window" class="flex-1 p-6 overflow-y-auto">
            <div class="message-ai mb-4 flex">
                <div class="bg-gray-200 text-gray-800 rounded-lg rounded-bl-none p-3 max-w-lg">
                    <p class="text-sm">Olá! Que bom te ver por aqui. Como posso te ajudar a conhecer mais sobre Sorocaba hoje?</p>
                </div>
            </div>
        </main>

        <footer class="p-4 bg-white border-t border-gray-200 md:rounded-b-2xl">
            <div class="flex items-center bg-gray-100 rounded-full p-2">
                <input type="text" id="user-input" placeholder="Digite sua pergunta..." class="flex-1 bg-transparent border-none focus:ring-0 text-gray-800 placeholder-gray-500 px-4">
                
                <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white rounded-full p-2.5 transition-colors duration-300 ml-2 hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" /></svg>
                </button>
                
                <div class="mic-wrapper">
                    <button id="mic-button" class="bg-blue-600 hover:bg-blue-700 text-white rounded-full p-2.5 transition-colors duration-300 ml-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z" clip-rule="evenodd" /></svg>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <div id="avatar-modal" class="modal">
        <span id="close-modal-btn" class="close-button">&times;</span>
        <img class="modal-content" id="modal-avatar-src">
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const micButton = document.getElementById('mic-button');
        const micWrapper = micButton.parentElement;

        userInput.addEventListener('input', () => {
            if (userInput.value.trim() !== '') {
                sendButton.classList.remove('hidden');
                micWrapper.classList.add('hidden');
            } else {
                sendButton.classList.add('hidden');
                micWrapper.classList.remove('hidden');
            }
        });

        async function sendMessage(directMessage = null) {
            const message = directMessage || userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            if (directMessage === null) userInput.value = '';
            userInput.dispatchEvent(new Event('input'));
            
            showTypingIndicator();

            try {
                const response = await fetch('/api/ask-sorocaba-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: message }),
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                removeTypingIndicator();
                appendMessage(data.answer, 'ai');

            } catch (error) {
                console.error('Erro ao comunicar com o backend:', error);
                removeTypingIndicator();
                appendMessage('Desculpe, ocorreu um erro. Por favor, tente novamente mais tarde.', 'ai');
            }
        }

        sendButton.addEventListener('click', () => sendMessage());
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });

        function appendMessage(message, sender) {
            const wrapper = document.createElement('div');
            const bubble = document.createElement('div');
            
            if (sender === 'user') {
                wrapper.className = 'message-user mb-4 flex justify-end';
                bubble.className = 'bg-[#2d4a32] text-white rounded-lg rounded-br-none p-3 max-w-lg';
            } else {
                wrapper.className = 'message-ai mb-4 flex';
                bubble.className = 'bg-gray-200 text-gray-800 rounded-lg rounded-bl-none p-3 max-w-lg';
            }
            
            bubble.innerHTML = `<p class="text-sm">${message.replace(/\n/g, '<br>')}</p>`;
            wrapper.appendChild(bubble);
            chatWindow.appendChild(wrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showTypingIndicator() {
            const indicator = `<div id="typing-indicator" class="message-ai mb-4 flex"><div class="bg-gray-200 text-gray-800 rounded-lg rounded-bl-none p-3 max-w-lg"><div class="flex items-center space-x-1"><span class="text-sm">Sorocab.IA está digitando</span><div class="h-2 w-2 bg-gray-400 rounded-full animate-bounce [animation-delay:-0.3s]"></div><div class="h-2 w-2 bg-gray-400 rounded-full animate-bounce [animation-delay:-0.15s]"></div><div class="h-2 w-2 bg-gray-400 rounded-full animate-bounce"></div></div></div></div>`;
            chatWindow.insertAdjacentHTML('beforeend', indicator);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function removeTypingIndicator() {
            document.getElementById('typing-indicator')?.remove();
        }
        
        // --- Lógica do Modal do Avatar ---
        const avatarModal = document.getElementById('avatar-modal');
        const avatarImg = document.getElementById('avatar-img');
        const modalAvatarSrc = document.getElementById('modal-avatar-src');
        const closeModalBtn = document.getElementById('close-modal-btn');

        avatarImg.onclick = function() {
            avatarModal.style.display = "flex";
            modalAvatarSrc.src = this.src;
        }

        closeModalBtn.onclick = function() {
            avatarModal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == avatarModal) {
                avatarModal.style.display = "none";
            }
        }

        // --- LÓGICA DE DETECÇÃO DE IOS (IPHONE/IPAD) ---
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        // --- LÓGICA DE RECONHECIMENTO DE VOZ (CORRIGIDA E CONDICIONAL) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        // Só ativa o microfone se o navegador tiver suporte E não for um dispositivo iOS
        if (SpeechRecognition && !isIOS) {
            const recognition = new SpeechRecognition();
            let recognitionActive = false;
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;

            const startRecognition = () => {
                if (recognitionActive) return;
                micWrapper.classList.add('recording');
                recognition.start();
                recognitionActive = true;
            };

            const stopRecognition = () => {
                if (!recognitionActive) return;
                micWrapper.classList.remove('recording');
                recognition.stop();
                recognitionActive = false;
            };
            
            // Eventos para Desktop (mouse)
            micButton.addEventListener('mousedown', startRecognition);
            micButton.addEventListener('mouseup', stopRecognition);
            
            // Eventos para Mobile (toque)
            micButton.addEventListener('touchstart', (e) => { e.preventDefault(); startRecognition(); });
            micButton.addEventListener('touchend', (e) => { e.preventDefault(); stopRecognition(); });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                sendMessage(transcript);
            };

            recognition.onspeechend = stopRecognition;

            recognition.onerror = (event) => {
                stopRecognition();
                console.error('Erro no reconhecimento de voz:', event.error);
                let errorMessage = 'Ocorreu um erro ao tentar te ouvir.';
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    errorMessage = 'Você precisa permitir o acesso ao microfone.';
                }
                appendMessage(errorMessage, 'ai');
            };
        } else {
            // Se não tiver suporte ou for iOS, esconde o botão do microfone.
            micWrapper.style.display = 'none';
        }

    </script>
</body>
</html>
